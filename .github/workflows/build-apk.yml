name: build-apk

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 서명 키 준비 (secrets 에 있을 때만)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/upload-keystore.jks
          cat > app/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=${KEY_ALIAS:-upload}
          storeFile=../upload-keystore.jks
          EOF
          echo "서명 키 준비 완료"

      - name: 버전 번호 (빌드 번호 = 실행 번호)
        id: ver
        run: |
          NAME=$(grep -E '^version:' app/pubspec.yaml | sed -E 's/version: *([0-9.]+)\+.*/\1/')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: 빌드
        working-directory: app
        run: |
          flutter --version
          flutter pub get
          flutter build apk --release --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.number }}
          ls -la build/app/outputs/flutter-apk/

      - name: APK 이름 정리
        run: cp app/build/app/outputs/flutter-apk/app-release.apk ./app-release.apk

      - name: Releases 에 올리기 (latest 태그 갱신)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 주식 스크리너 앱 v${{ steps.ver.outputs.name }} (빌드 ${{ steps.ver.outputs.number }})
          body: |
            안드로이드 APK. 아래 `app-release.apk` 를 폰에서 내려받아 설치하세요.
            (설치법은 README 참고)
          files: app-release.apk
          prerelease: false
          make_latest: true

      - name: 빌드 결과물 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app-release.apk
